  <path d="M78 294 A13 13 0 0 0 74 285" fill="none" stroke="#c9fbfb" stroke-width="1.5"/>
  <text x="110" y="300" text-anchor="start" font-size="15" fill="#c9fbfb">shift a phase everywhere</text>
  <line x1="345" y1="295" x2="385" y2="295" stroke="#c9fbfb" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="400" y="300" text-anchor="start" font-size="16" fill="#fff">electric charge</text>
  <text x="300" y="352" text-anchor="middle" font-size="14" fill="#c9fbfb" fill-opacity=".85">the laws stay the same under each change</text>
