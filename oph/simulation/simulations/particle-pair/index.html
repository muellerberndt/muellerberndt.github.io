<script src="../../assets/hls.min.js"></script>
<script>
const v = document.getElementById("v"), btn = document.getElementById("play"), slider = document.getElementById("time");
const clock = document.getElementById("clock"), src = "../../media/particle-pair/master.m3u8";
const start = () => { v.muted = true; const p = v.play(); if (p) p.catch(() => {}); };
if (v.canPlayType("application/vnd.apple.mpegurl")) { v.src = src; v.addEventListener("loadedmetadata", start); }
else if (window.Hls && Hls.isSupported()) {
  const h = new Hls({ capLevelToPlayerSize: true, startLevel: -1 });
  h.on(Hls.Events.MANIFEST_PARSED, start); h.loadSource(src); h.attachMedia(v);
} else { v.src = src; }
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
let dragging = false;
v.addEventListener("play", () => { btn.textContent = "❚❚"; });
v.addEventListener("pause", () => { btn.textContent = "▶"; });
v.addEventListener("timeupdate", () => {
  if (!dragging && v.duration) slider.value = Math.round(1000 * v.currentTime / v.duration);
  clock.textContent = `${fmt(v.currentTime || 0)} / ${fmt(v.duration || 0)}`;
});
const toggle = () => (v.paused ? start() : v.pause());

slider.onchange = () => { dragging = false; };
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  if (e.code === "ArrowRight") { v.pause(); v.currentTime += 1 / 24; }
  if (e.code === "ArrowLeft") { v.pause(); v.currentTime -= 1 / 24; }
});
